<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anda Sedang Offline — Aesthetic Pondok Indah</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-cream: #FAF8F5;
            --gold: #C59E3F;
            --gold-dark: #A37E28;
            --charcoal: #2C2416;
            --warm-gray: #5C5546;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg-cream);
            color: var(--charcoal);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }
        .offline-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(197, 158, 63, 0.3);
            border-radius: 28px;
            padding: 40px 32px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 15px 35px rgba(44, 36, 22, 0.08);
        }
        .icon-box {
            width: 80px;
            height: 80px;
            background: rgba(197, 158, 63, 0.12);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: var(--gold-dark);
            font-size: 36px;
        }
        h1 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 26px;
            color: var(--charcoal);
            margin-bottom: 10px;
        }
        p {
            font-size: 14px;
            color: var(--warm-gray);
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .btn-retry {
            display: inline-block;
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
            color: white;
            padding: 12px 28px;
            border-radius: 50rem;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(197, 158, 63, 0.3);
            transition: transform 0.2s, opacity 0.2s;
        }
        .btn-retry:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="icon-box">📡</div>
        <h1>Anda Sedang Offline</h1>
        <p>Koneksi internet Anda terputus. Halaman atau fitur yang telah Anda buka sebelumnya tetap dapat diakses dari data cache lokal.</p>
        <button class="btn-retry" onclick="window.location.reload()">🔄 Coba Muat Ulang</button>
    </div>
</body>
</html>
